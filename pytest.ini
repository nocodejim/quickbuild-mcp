[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --cov=src --cov-report=term-missing -v -m "not e2e"
markers =
    e2e: end-to-end tests against a live QuickBuild harness (scripts/e2e.sh; excluded by default)
