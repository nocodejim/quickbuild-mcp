# QuickBuild 16 Multi-Container Deployment with Microsoft SQL Server 2025
# Complete Docker Compose orchestration for development and small production deployments
# Includes database, server, and scalable build agents
#
# Image versions are pinned in the Dockerfiles; override them by exporting the build args
# listed under each service (e.g. QB_VERSION + QB_DOWNLOAD_URL + QB_DOWNLOAD_SHA256, MSSQL_IMAGE).
# Build the base agent image first: the toolchain agents are built FROM qb-agent-base:latest
#   docker compose build qb-agent-base && docker compose build

services:
  # Microsoft SQL Server Database
  qb-database:
    build:
      context: .
      dockerfile: ./qb-database/Dockerfile
      args:
        - MSSQL_IMAGE
    container_name: qb-database
    hostname: qb-database
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${MSSQL_SA_PASSWORD:-TestPassword123!}
      - QB_DB_PASSWORD=${QB_DB_PASSWORD:-QBTestPassword123!}
      - MSSQL_PID=${MSSQL_PID:-Express}
      - MSSQL_COLLATION=${MSSQL_COLLATION:-SQL_Latin1_General_CP1_CI_AS}
      - QB_DB_NAME=quickbuild
      - QB_DB_USER=qb_user
    volumes:
      - qb-db-data:/var/opt/mssql/data
      - qb-db-logs:/var/opt/mssql/log
    networks:
      - qb-net
    ports:
      # Database port not exposed externally for security
      - "1433"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/mssql-scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # QuickBuild Server
  qb-server:
    build:
      context: .
      dockerfile: ./qb-server/Dockerfile
      args:
        - JDK_IMAGE
        - QB_VERSION
        - QB_DOWNLOAD_URL
        - QB_DOWNLOAD_SHA256
        - MSSQL_JDBC_VERSION
        - MSSQL_JDBC_SHA256
    container_name: qb-server
    hostname: qb-server
    environment:
      - QB_DB_TYPE=mssql
      - QB_DB_HOST=qb-database
      - QB_DB_PORT=1433
      - QB_DB_NAME=quickbuild
      - QB_DB_USER=qb_user
      - QB_DB_PASSWORD=${QB_DB_PASSWORD:-QBTestPassword123!}
      - QB_SERVER_URL=http://qb-server:8810
      - QB_SERVER_PORT=${QB_SERVER_PORT:-8810}
      - QB_LOG_LEVEL=${QB_LOG_LEVEL:-INFO}
    volumes:
      - qb-server-data:/opt/quickbuild/data
      # Global storage directory (must be outside the install dir; enter this path in the setup wizard)
      - qb-server-storage:/var/lib/quickbuild/storage
    networks:
      - qb-net
    ports:
      - "${QB_SERVER_PORT:-8810}:8810"
    depends_on:
      qb-database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/quickbuild/healthcheck.sh"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Base Build Agent
  qb-agent-base:
    build:
      context: .
      dockerfile: ./qb-agent/base/Dockerfile
      args:
        - JDK_IMAGE
        - QB_VERSION
        - QB_DOWNLOAD_URL
        - QB_DOWNLOAD_SHA256
    # Tagged so the maven/node/dotnet agent images can build FROM it
    image: qb-agent-base:latest
    environment:
      - QB_SERVER_URL=http://qb-server:8810
      - AGENT_PORT=8811
      - AGENT_NAME=base-agent-${COMPOSE_PROJECT_NAME:-quickbuild}
    networks:
      - qb-net
    depends_on:
      qb-server:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: ${AGENT_BASE_REPLICAS:-1}
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Maven Build Agent
  qb-agent-maven:
    build:
      context: .
      dockerfile: ./qb-agent/maven/Dockerfile
    environment:
      - QB_SERVER_URL=http://qb-server:8810
      - AGENT_PORT=8811
      - AGENT_NAME=maven-agent-${COMPOSE_PROJECT_NAME:-quickbuild}
      - MAVEN_OPTS=-Xmx1024m
    volumes:
      - qb-maven-cache:/opt/qb-agent/.m2/repository
    networks:
      - qb-net
    depends_on:
      qb-server:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: ${AGENT_MAVEN_REPLICAS:-1}
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G

  # Node.js Build Agent
  qb-agent-node:
    build:
      context: .
      dockerfile: ./qb-agent/node/Dockerfile
    environment:
      - QB_SERVER_URL=http://qb-server:8810
      - AGENT_PORT=8811
      - AGENT_NAME=node-agent-${COMPOSE_PROJECT_NAME:-quickbuild}
    volumes:
      - qb-node-cache:/opt/qb-agent/.npm
      - qb-node-global:/opt/qb-agent/.npm-global
    networks:
      - qb-net
    depends_on:
      qb-server:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: ${AGENT_NODE_REPLICAS:-1}
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G

  # .NET Build Agent
  qb-agent-dotnet:
    build:
      context: .
      dockerfile: ./qb-agent/dotnet/Dockerfile
    environment:
      - QB_SERVER_URL=http://qb-server:8810
      - AGENT_PORT=8811
      - AGENT_NAME=dotnet-agent-${COMPOSE_PROJECT_NAME:-quickbuild}
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
      - DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
      - DOTNET_NOLOGO=1
    volumes:
      - qb-dotnet-packages:/opt/qb-agent/.nuget/packages
    networks:
      - qb-net
    depends_on:
      qb-server:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: ${AGENT_DOTNET_REPLICAS:-1}
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G

  # QuickBuild MCP Server (AI Agent Integration)
  mcp-quickbuild-server:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: mcp-quickbuild-server
    # stdin is only used with MCP_TRANSPORT=stdio (e.g. `docker compose run --rm -T mcp-quickbuild-server`)
    stdin_open: true
    tty: false
    environment:
      - QB_URL=${QB_URL:-http://qb-server:8810}
      - QB_USER=${QB_USER:-admin}
      - QB_PASSWORD=${QB_PASSWORD:-admin}
      - QB_AUTH_MODE=${QB_AUTH_MODE:-basic}
      - QB_TOKEN=${QB_TOKEN:-}
      - QB_READ_ONLY=${QB_READ_ONLY:-false}
      - QB_VERIFY_SSL=${QB_VERIFY_SSL:-true}
      - QB_TIMEOUT=${QB_TIMEOUT:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Streamable HTTP for a gateway: http://<host>:${MCP_PORT}/mcp, /health, /ready
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=14002
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
      - QB_CACHE_TTL_CONFIGS=${QB_CACHE_TTL_CONFIGS:-300}
      - QB_CACHE_TTL_AGENTS=${QB_CACHE_TTL_AGENTS:-30}
    ports:
      - "${MCP_PORT:-14002}:14002"
    networks:
      - qb-net
    depends_on:
      qb-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # MCP Server Unit Test Runner
  test:
    build:
      context: .
      dockerfile: ./Dockerfile.test
    environment:
      - QB_URL=http://mock-quickbuild:8810
      - QB_USER=testuser
      - QB_PASSWORD=testpass
      - LOG_LEVEL=DEBUG
    volumes:
      - ./coverage:/coverage
    profiles:
      - test

# Named volumes for data persistence
volumes:
  # Database volumes
  qb-db-data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-quickbuild}_db_data
  qb-db-logs:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-quickbuild}_db_logs
  
  # Server volumes
  qb-server-data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-quickbuild}_server_data
  qb-server-storage:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-quickbuild}_server_storage
  
  # Agent cache volumes
  qb-maven-cache:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-quickbuild}_maven_cache
  qb-node-cache:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-quickbuild}_node_cache
  qb-node-global:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-quickbuild}_node_global
  qb-dotnet-packages:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-quickbuild}_dotnet_packages

# Custom network for service communication
networks:
  qb-net:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-quickbuild}_qb_net
    ipam:
      config:
        - subnet: ${QB_NETWORK_SUBNET:-172.20.0.0/16}
    driver_opts:
      com.docker.network.bridge.name: qb-bridge