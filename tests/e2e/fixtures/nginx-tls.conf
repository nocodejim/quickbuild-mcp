# e2e TLS front for QuickBuild: HTTPS on 8443 with a certificate from a throwaway CA that
# scripts/e2e.sh generates per run. Used to verify QB_CA_BUNDLE / QB_VERIFY_SSL and HTTPS
# through a proxy, the way the MCP server reaches a corporate QuickBuild.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://qb-server:8810;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
